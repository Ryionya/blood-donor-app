{% extends 'base.html' %}
{% block title %}Forgot Password — BloodLink{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-danger fw-bold mb-1">Forgot Password?</h3>
                <p class="text-muted mb-4">Enter your email and we'll send you a reset link.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" 
                               placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Send Reset Link</button>
                </form>

                <p class="text-center mt-3 text-muted">
                    Remember your password? <a href="{% url 'login' %}">Log in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
