{% extends 'base.html' %}
{% block title %}Email Sent — BloodLink{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm text-center">
            <div class="card-body p-4">
                <div class="display-1 mb-3">📧</div>
                <h3 class="text-danger fw-bold mb-2">Check your email!</h3>
                <p class="text-muted">
                    We've sent a password reset link to your email address. 
                    Please check your inbox and follow the instructions.
                </p>
                <a href="{% url 'login' %}" class="btn btn-outline-danger mt-2">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
