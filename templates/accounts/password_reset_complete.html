{% extends 'base.html' %}
{% block title %}Password Reset Complete — BloodLink{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm text-center">
            <div class="card-body p-4">
                <div class="display-1 mb-3">✅</div>
                <h3 class="text-danger fw-bold mb-2">Password Reset!</h3>
                <p class="text-muted">
                    Your password has been successfully reset. 
                    You can now log in with your new password.
                </p>
                <a href="{% url 'login' %}" class="btn btn-danger mt-2">
                    Log In Now
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
